<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLUDDIE 文創小攤 POS</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FAFAF8;--surface:#FFFFFF;--s2:#F5F4F0;--s3:#EDECE8;
  --border:#E0DED8;--border2:#CCCAC3;
  --text:#1A1916;--text2:#6B6960;--text3:#A8A69E;
  --green:#0F6E56;--gbg:#E1F5EE;
  --amber:#8A5E0A;--abg:#FEF3DC;
  --red:#8C2222;--rbg:#FCEAEA;
  --blue:#185FA5;--bbg:#E6F1FB;
  --r:10px;--rl:14px;--rp:999px;
  --font:'Noto Sans TC',sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}
.app{display:grid;grid-template-columns:1fr 320px;height:100vh;max-width:1100px;margin:0 auto}
.left{display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--border)}
.right{display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}

/* topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0}
.shop-name{font-size:16px;font-weight:700;letter-spacing:-.01em}
.date-chip{font-size:11px;color:var(--text2);background:var(--s2);border:1px solid var(--border);border-radius:var(--rp);padding:3px 10px}
.icon-btn{width:32px;height:32px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .15s}
.icon-btn:hover{background:var(--s2)}
.icon-btn.active{background:var(--text);color:var(--surface);border-color:var(--text)}

/* tabs */
.tabs-wrap{padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;display:flex;gap:5px;flex-wrap:wrap}
.tab{font-size:12px;padding:5px 12px;border-radius:var(--rp);border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;transition:all .12s;white-space:nowrap}
.tab:hover{border-color:var(--border2);color:var(--text)}
.tab.on{background:var(--text);color:var(--surface);border-color:var(--text)}

/* grid */
.items-scroll{flex:1;overflow-y:auto;padding:14px;background:var(--bg)}
.items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}
.item-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:11px 8px;cursor:pointer;text-align:center;transition:all .12s;position:relative;user-select:none}
.item-card:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.06)}
.item-card:active{transform:scale(.97)}
.ic-emoji{font-size:20px;display:block;margin-bottom:3px}
.ic-name{font-size:11px;font-weight:500;color:var(--text);display:block;margin-bottom:3px;line-height:1.3}
.ic-price{font-size:13px;font-weight:700;color:var(--green)}
.ic-edit-btn{position:absolute;top:4px;right:5px;font-size:10px;color:var(--text3);cursor:pointer;width:16px;height:16px;display:flex;align-items:center;justify-content:center;border-radius:4px}
.ic-edit-btn:hover{color:var(--text2);background:var(--s2)}
.add-card{background:transparent;border:1px dashed var(--border2);border-radius:var(--rl);padding:11px 8px;cursor:pointer;text-align:center;color:var(--text3);font-size:12px;transition:all .12s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:76px}
.add-card:hover{color:var(--text2);background:var(--surface)}

/* right panel tabs */
.panel-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.ptab{flex:1;padding:9px 4px;font-size:11px;text-align:center;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;transition:all .12s}
.ptab:hover{color:var(--text)}
.ptab.on{color:var(--text);border-bottom-color:var(--text);font-weight:500}

/* cart */
.cart-scroll{flex:1;overflow-y:auto;padding:8px 14px}
.empty-cart{text-align:center;padding:32px 0;color:var(--text3);font-size:13px}
.cart-row{display:flex;align-items:center;gap:7px;padding:6px 0;border-bottom:1px solid var(--border)}
.cart-row:last-child{border:none}
.cart-name{flex:1;font-size:12px;color:var(--text);line-height:1.3}
.qty-ctrl{display:flex;align-items:center;gap:4px}
.qbtn{width:21px;height:21px;border-radius:50%;border:1px solid var(--border);background:var(--s2);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text);transition:all .1s}
.qbtn:hover{background:var(--s3)}
.qnum{font-size:12px;font-weight:500;min-width:14px;text-align:center}
.cart-sub{font-size:12px;font-weight:500;min-width:42px;text-align:right}

/* discount */
.disc-section{padding:9px 14px;border-top:1px solid var(--border);background:var(--s2);flex-shrink:0}
.disc-title{font-size:11px;color:var(--text2);margin-bottom:6px;font-weight:500}
.preset-disc{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.dbtn{font-size:11px;padding:4px 9px;border-radius:var(--rp);border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;transition:all .12s}
.dbtn:hover{border-color:var(--border2)}
.dbtn.on{background:var(--abg);color:var(--amber);border-color:var(--amber)}
.custom-row{display:flex;align-items:center;gap:6px}
.custom-row label{font-size:11px;color:var(--text2)}
.custom-row input{width:58px;padding:4px 7px;border:1px solid var(--border);border-radius:var(--r);font-size:12px;color:var(--text);background:var(--surface);font-family:var(--font)}

/* total */
.total-section{padding:10px 14px;border-top:1px solid var(--border);flex-shrink:0}
.t-line{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:3px}
.t-line.disc-l{color:var(--amber)}
.t-line.main{font-size:17px;font-weight:700;color:var(--text);margin-top:5px;margin-bottom:0}
.checkout-btn{width:100%;margin-top:10px;padding:11px;background:var(--text);color:var(--surface);border:none;border-radius:var(--rl);font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font)}
.checkout-btn:hover{opacity:.85}
.checkout-btn:disabled{opacity:.3;cursor:not-allowed}
.clear-btn{width:100%;margin-top:5px;padding:7px;background:transparent;border:1px solid var(--border);border-radius:var(--r);font-size:12px;color:var(--text2);cursor:pointer;font-family:var(--font)}
.clear-btn:hover{background:var(--s2)}
.free-row{display:flex;align-items:center;gap:6px;margin-left:auto}
.free-row span{font-size:11px;color:var(--text2)}
.toggle{position:relative;width:36px;height:20px}
.toggle input{opacity:0;width:0;height:0}
.toggle-s{position:absolute;inset:0;background:var(--s3);border-radius:10px;cursor:pointer;transition:all .2s}
.toggle-s:before{content:'';position:absolute;width:14px;height:14px;left:3px;top:3px;background:white;border-radius:50%;transition:all .2s}
.toggle input:checked+.toggle-s{background:var(--green)}
.toggle input:checked+.toggle-s:before{transform:translateX(16px)}

/* stats bar */
.stats-bar{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--border);flex-shrink:0}
.stat-box{padding:9px 14px;text-align:center}
.stat-box:first-child{border-right:1px solid var(--border)}
.stat-label{font-size:10px;color:var(--text3);display:block;margin-bottom:1px;letter-spacing:.04em}
.stat-val{font-size:15px;font-weight:700}

/* log */
.log-wrap{flex:1;overflow-y:auto;padding:10px 14px}
.log-empty{text-align:center;padding:32px 0;color:var(--text3);font-size:12px}
.log-item{padding:8px 0;border-bottom:1px solid var(--border)}
.log-item:last-child{border:none}
.log-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.log-no{font-size:10px;color:var(--text3);font-weight:500}
.log-right{display:flex;align-items:center;gap:5px}
.log-amt{font-size:13px;font-weight:700;color:var(--green)}
.log-disc-badge{font-size:10px;padding:2px 6px;border-radius:var(--rp);background:var(--abg);color:var(--amber);font-weight:500}
.log-time{font-size:10px;color:var(--text3)}
.log-items-text{font-size:11px;color:var(--text2);line-height:1.5}
.pay-badges{display:flex;gap:4px;margin-top:3px}
.pay-badge{font-size:10px;padding:2px 6px;border-radius:var(--rp);font-weight:500}
.pay-badge.cash{background:var(--gbg);color:var(--green)}
.pay-badge.lp{background:var(--bbg);color:var(--blue)}

/* summary */
.summary-wrap{flex:1;overflow-y:auto;padding:14px}
.sum-sec-title{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;margin-top:14px}
.sum-sec-title:first-child{margin-top:0}
.sum-cards{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:4px}
.sum-card{background:var(--s2);border-radius:var(--r);padding:9px 11px}
.sc-label{font-size:10px;color:var(--text2);display:block;margin-bottom:2px}
.sc-val{font-size:16px;font-weight:700}
.top-item-row{display:flex;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px;gap:8px}
.top-item-row:last-child{border:none}
.top-rank{width:18px;height:18px;border-radius:50%;background:var(--s3);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--text2);flex-shrink:0}
.top-rank.r1{background:var(--text);color:var(--surface)}
.top-rank.r2{background:var(--text2);color:var(--surface)}
.top-rank.r3{background:var(--border2);color:var(--surface)}
.top-item-name{flex:1;color:var(--text)}
.top-item-qty{color:var(--text2);font-size:11px}

/* history */
.hist-wrap{flex:1;overflow-y:auto}
.hist-date-select{padding:10px 14px;border-bottom:1px solid var(--border);background:var(--s2);flex-shrink:0}
.hist-select-label{font-size:11px;color:var(--text2);margin-bottom:5px}
.date-grid{display:flex;gap:5px;flex-wrap:wrap}
.date-pill{font-size:11px;padding:4px 10px;border-radius:var(--rp);border:1px solid var(--border);background:var(--surface);cursor:pointer;color:var(--text2);transition:all .12s;white-space:nowrap}
.date-pill:hover{border-color:var(--border2);color:var(--text)}
.date-pill.on{background:var(--text);color:var(--surface);border-color:var(--text)}
.hist-content{padding:12px 14px;overflow-y:auto;flex:1}
.hist-empty{text-align:center;padding:32px 0;color:var(--text3);font-size:12px}
.hist-day-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;padding-bottom:7px;border-bottom:2px solid var(--border)}
.hist-day-date{font-size:14px;font-weight:700}
.hist-day-total{font-size:16px;font-weight:700;color:var(--green)}
.hist-item-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px}
.hist-item-row:last-child{border:none}
.hist-item-name{flex:1;color:var(--text)}
.hist-item-qty{color:var(--text2);margin:0 10px;font-size:11px}
.hist-item-sub{font-weight:500;color:var(--text)}
.hist-pay-row{display:flex;gap:6px;margin-top:10px;padding-top:8px;border-top:1px solid var(--border)}
.hist-year-group{margin-bottom:6px}
.hist-year-label{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.06em;padding:4px 0 3px;text-transform:uppercase}
.hist-date-pills{display:flex;gap:4px;flex-wrap:wrap}

/* settings */
.settings-wrap{flex:1;overflow-y:auto}
.settings-section{border-bottom:1px solid var(--border);padding:14px}
.st-title{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:11px;display:flex;align-items:center;gap:5px}
.sr{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border)}
.sr:last-child{border:none}
.sr-label{font-size:13px}
.sr-sub{font-size:11px;color:var(--text2);margin-top:1px}
.si{padding:6px 9px;border:1px solid var(--border);border-radius:var(--r);font-size:13px;color:var(--text);background:var(--surface);font-family:var(--font);width:155px}
.si:focus{outline:none;border-color:var(--border2)}
.si.sm{width:74px}
.disc-preset-item{display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px solid var(--border)}
.disc-preset-item:last-child{border:none}
.dpi-in{padding:5px 7px;border:1px solid var(--border);border-radius:var(--r);font-size:12px;color:var(--text);background:var(--surface);font-family:var(--font);width:55px}
.dpi-lin{padding:5px 7px;border:1px solid var(--border);border-radius:var(--r);font-size:12px;color:var(--text);background:var(--surface);font-family:var(--font);width:75px}
.dpi-del{width:22px;height:22px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px}
.dpi-del:hover{background:var(--rbg);color:var(--red)}
.add-preset-btn{font-size:12px;color:var(--text2);border:1px dashed var(--border2);background:transparent;border-radius:var(--r);padding:6px 12px;cursor:pointer;width:100%;margin-top:7px;font-family:var(--font)}
.add-preset-btn:hover{background:var(--s2)}
.danger-btn{font-size:12px;color:var(--red);border:1px solid var(--rbg);background:var(--rbg);border-radius:var(--r);padding:6px 12px;cursor:pointer;font-family:var(--font)}
.danger-btn:hover{background:#f5d5d5}
.save-settings-btn{width:100%;padding:10px;background:var(--text);color:var(--surface);border:none;border-radius:var(--rl);font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);margin-top:11px}
.save-settings-btn:hover{opacity:.85}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:var(--rl);border:1px solid var(--border);padding:18px;width:285px;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal h3{font-size:14px;font-weight:700;margin-bottom:14px}
.mf{margin-bottom:10px}
.mf label{display:block;font-size:11px;color:var(--text2);margin-bottom:3px;font-weight:500}
.mf input,.mf select{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:var(--r);font-size:13px;color:var(--text);background:var(--surface);font-family:var(--font)}
.mf input:focus,.mf select:focus{outline:none;border-color:var(--border2)}
.emoji-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;max-height:80px;overflow-y:auto}
.emoji-opt{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);background:var(--s2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px}
.emoji-opt:hover,.emoji-opt.sel{border-color:var(--text);background:var(--surface)}
.mbtns{display:flex;gap:6px;margin-top:14px}
.mbtns button{flex:1;padding:8px;border-radius:var(--r);font-size:12px;cursor:pointer;font-family:var(--font);font-weight:500}
.mbtn-cancel{background:transparent;border:1px solid var(--border);color:var(--text2)}
.mbtn-del{background:var(--rbg);border:none;color:var(--red);flex:0 0 auto;padding:8px 11px}
.mbtn-save{background:var(--text);border:none;color:var(--surface)}

/* confirm */
.confirm-box{background:var(--surface);border-radius:var(--rl);border:1px solid var(--border);padding:18px;width:265px;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.confirm-box h3{font-size:14px;font-weight:700;margin-bottom:7px}
.confirm-box p{font-size:12px;color:var(--text2);margin-bottom:13px;line-height:1.6}
.confirm-btns{display:flex;gap:6px}
.confirm-btns button{flex:1;padding:8px;border-radius:var(--r);font-size:12px;cursor:pointer;font-family:var(--font);font-weight:500}

/* toast */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--text);color:var(--surface);padding:8px 18px;border-radius:var(--rp);font-size:12px;font-weight:500;opacity:0;transition:all .22s;pointer-events:none;z-index:300;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:680px){
  .app{grid-template-columns:1fr;height:auto}
  .left{height:auto}
  .right{height:600px}
}
</style>
</head>
<body>
<div class="app">
  <div class="left">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:9px">
        <span class="shop-name" id="shopNameDisplay">PLUDDIE 文創小攤</span>
        <span class="date-chip" id="dateChip"></span>
      </div>
      <div style="display:flex;gap:5px">
        <button class="icon-btn" onclick="switchPanel('settings')" id="btn-settings" title="設定">⚙️</button>
      </div>
    </div>
    <div class="tabs-wrap" id="tabsEl"></div>
    <div class="items-scroll">
      <div class="items-grid" id="itemsGrid"></div>
    </div>
  </div>

  <div class="right">
    <div class="panel-tabs">
      <div class="ptab on" id="ptab-order" onclick="switchPanel('order')">🛍 點單</div>
      <div class="ptab" id="ptab-log" onclick="switchPanel('log')">📋 今日明細</div>
      <div class="ptab" id="ptab-hist" onclick="switchPanel('hist')">📅 歷史</div>
      <div class="ptab" id="ptab-summary" onclick="switchPanel('summary')">📊 統計</div>
      <div class="ptab" id="ptab-settings" onclick="switchPanel('settings')" style="display:none">⚙️ 設定</div>
    </div>

    <!-- ORDER -->
    <div id="panel-order" style="display:flex;flex-direction:column;flex:1;overflow:hidden;min-height:0">
      <div class="cart-scroll" id="cartScroll"><div class="empty-cart">🛒<br>點選左方商品加入訂單</div></div>
      <div class="disc-section">
        <div class="disc-title">🏷 折扣優惠</div>
        <div class="preset-disc" id="presetDiscEl"></div>
        <div class="custom-row">
          <label>自訂</label>
          <input type="number" id="customDiscInput" min="1" max="99" placeholder="88" oninput="applyCustomDisc(this.value)">
          <span style="font-size:11px;color:var(--text2)">折</span>
          <div class="free-row">
            <span>免費</span>
            <label class="toggle"><input type="checkbox" id="freeToggle" onchange="toggleFree(this.checked)"><span class="toggle-s"></span></label>
          </div>
        </div>
      </div>
      <div class="total-section">
        <div id="subtotalLine" class="t-line" style="display:none"><span>小計</span><span id="subtotalVal"></span></div>
        <div id="discLine" class="t-line disc-l" style="display:none"><span id="discLabel"></span><span id="discVal"></span></div>
        <div class="t-line main"><span>合計</span><span id="totalVal">$0</span></div>
        <button class="checkout-btn" id="checkoutBtn" onclick="checkout()" disabled>結帳</button>
        <button class="clear-btn" onclick="clearCart()">清空訂單</button>
      </div>
      <div class="stats-bar">
        <div class="stat-box"><span class="stat-label">今日營業額</span><span class="stat-val" id="revVal">$0</span></div>
        <div class="stat-box"><span class="stat-label">今日筆數</span><span class="stat-val" id="cntVal">0 筆</span></div>
      </div>
    </div>

    <!-- TODAY LOG -->
    <div id="panel-log" style="display:none;flex-direction:column;flex:1;overflow:hidden;min-height:0">
      <div class="log-wrap" id="logWrap"></div>
    </div>

    <!-- HISTORY -->
    <div id="panel-hist" style="display:none;flex-direction:column;flex:1;overflow:hidden;min-height:0">
      <div class="hist-date-select">
        <div class="hist-select-label">選擇日期查看明細</div>
        <div id="histDateGrid"></div>
      </div>
      <div class="hist-content" id="histContent">
        <div class="hist-empty">👆 選擇日期查看歷史記錄</div>
      </div>
    </div>

    <!-- SUMMARY -->
    <div id="panel-summary" style="display:none;flex-direction:column;flex:1;overflow:hidden;min-height:0">
      <div class="summary-wrap" id="summaryWrap"></div>
    </div>

    <!-- SETTINGS -->
    <div id="panel-settings" style="display:none;flex-direction:column;flex:1;overflow:hidden;min-height:0">
      <div class="settings-wrap">
        <div class="settings-section">
          <div class="st-title">🏪 攤位資訊</div>
          <div class="sr"><div><div class="sr-label">攤位名稱</div></div><input class="si" id="sShopName" type="text" maxlength="20"></div>
          <div class="sr"><div><div class="sr-label">幣別符號</div></div><input class="si sm" id="sCurrency" type="text" maxlength="3"></div>
        </div>
        <div class="settings-section">

function load() {
  try {
    const raw = localStorage.getItem(SK); if(!raw) return;
    const d = JSON.parse(raw);
    if(d.shopName) S.shopName=d.shopName;
    if(d.currency) S.currency=d.currency;
    if(d.items) S.items=d.items;
    if(d.discPresets) S.discPresets=d.discPresets;
    if(d.daily && d.daily.date===TODAY) S.daily=d.daily;
  } catch(e){}
}
function save(){try{localStorage.setItem(SK,JSON.stringify({shopName:S.shopName,currency:S.currency,items:S.items,discPresets:S.discPresets,daily:S.daily}));}catch(e){}}

const cur = () => S.currency||'$';
const cats = () => ['全部',...new Set(S.items.map(i=>i.cat))];
const filtered = () => activeTab==='全部' ? S.items : S.items.filter(i=>i.cat===activeTab);

function rAll() {
  document.getElementById('shopNameDisplay').textContent = S.shopName||'文創小攤';

  if(activePanel==='log') rLog();
  if(activePanel==='hist') rHist();

  if(activePanel==='settings') rSettings();
}

function rTabs() {

    cats().map(c=>`<div class="tab ${c===activeTab?'on':''}" onclick="setTab('${c}')">${c}</div>`).join('') +
    `<div class="tab" style="border-style:dashed" onclick="openAddItem()">＋</div>`;
}
function setTab(c){activeTab=c;rTabs();rGrid();}

function rGrid() {
  document.getElementById('itemsGrid').innerHTML =
    filtered().map(item=>`
      <div class="item-card" onclick="addCart(${item.id})">
        <span class="ic-edit-btn" onclick="event.stopPropagation();openEditItem(${item.id})">✏️</span>
        <span class="ic-emoji">${item.emoji||'🎁'}</span>
        <span class="ic-name">${item.name}</span>
        <span class="ic-price">${cur()}${item.price}</span>
      </div>`).join('') +
    `<div class="add-card" onclick="openAddItem()"><span style="font-size:20px">＋</span><span>新增</span></div>`;
}

function addCart(id){S.cart[id]=(S.cart[id]||0)+1;rCart();}
function changeQty(id,d){const n=(S.cart[id]||0)+d;if(n<=0)delete S.cart[id];else S.cart[id]=n;rCart();}
function clearCart(){S.cart={};S.disc={label:null,rate:1};document.querySelectorAll('.dbtn').forEach(b=>b.classList.remove('on'));document.getElementById('customDiscInput').value='';document.getElementById('freeToggle').checked=false;rCart();}

function rCart() {
  const keys = Object.keys(S.cart);
  const el = document.getElementById('cartScroll');
  if(!keys.length){el.innerHTML='<div class="empty-cart">🛒<br>點選左方商品加入訂單</div>';document.getElementById('checkoutBtn').disabled=true;document.getElementById('totalVal').textContent=cur()+'0';document.getElementById('subtotalLine').style.display='none';document.getElementById('discLine').style.display='none';return;}
  let sub=0;
  el.innerHTML=keys.map(id=>{const item=S.items.find(i=>i.id==id);if(!item)return'';const qty=S.cart[id];const s=item.price*qty;sub+=s;
    return`<div class="cart-row"><span class="cart-name">${item.emoji||''} ${item.name}</span><div class="qty-ctrl"><button class="qbtn" onclick="changeQty(${id},-1)">−</button><span class="qnum">${qty}</span><button class="qbtn" onclick="changeQty(${id},1)">+</button></div><span class="cart-sub">${cur()}${s}</span></div>`;}).join('');
  const total=S.disc.rate===0?0:Math.round(sub*S.disc.rate);
  const saved=sub-total;
  document.getElementById('totalVal').textContent=cur()+total;
  document.getElementById('checkoutBtn').disabled=false;
  if(S.disc.rate<1||S.disc.rate===0){
    document.getElementById('subtotalLine').style.display='flex';document.getElementById('subtotalVal').textContent=cur()+sub;
    document.getElementById('discLine').style.display='flex';
    document.getElementById('discLabel').textContent=(S.disc.rate===0?'免費贈送':(S.disc.label||'折扣')+' 優惠');
    document.getElementById('discVal').textContent='-'+cur()+saved;
  }else{document.getElementById('subtotalLine').style.display='none';document.getElementById('discLine').style.display='none';}
}

function rStats(){document.getElementById('revVal').textContent=cur()+S.daily.revenue;document.getElementById('cntVal').textContent=S.daily.count+' 筆';}

function rPresetDisc(){
  document.getElementById('presetDiscEl').innerHTML=
    S.discPresets.map(p=>`<div class="dbtn" onclick="setDisc('${p.label}',${p.value/100})">${p.label}</div>`).join('')+
    `<div class="dbtn" onclick="setDisc(null,1)" style="border-style:dashed">不折</div>`;
}

function setDisc(label,rate){
  document.querySelectorAll('.dbtn').forEach(b=>b.classList.remove('on'));
  document.getElementById('freeToggle').checked=false;
  if(label){S.disc={label,rate};event.target.classList.add('on');}
  else{S.disc={label:null,rate:1};document.getElementById('customDiscInput').value='';}
  rCart();
}
function applyCustomDisc(v){
  const n=parseInt(v);document.getElementById('freeToggle').checked=false;
  if(n>=1&&n<=99){S.disc={label:n+'折',rate:n/100};document.querySelectorAll('.dbtn').forEach(b=>b.classList.remove('on'));}
  else if(!v){S.disc={label:null,rate:1};}
  rCart();
}
function toggleFree(checked){
  if(checked){S.disc={label:'免費',rate:0};document.querySelectorAll('.dbtn').forEach(b=>b.classList.remove('on'));document.getElementById('customDiscInput').value='';}
  else{S.disc={label:null,rate:1};}
  rCart();
}

function checkout(){
  const keys=Object.keys(S.cart);if(!keys.length)return;
  let sub=0;
  const names=keys.map(id=>{const item=S.items.find(i=>i.id==id);const qty=S.cart[id];sub+=item.price*qty;return qty>1?`${item.name}×${qty}`:item.name;});
  const total=S.disc.rate===0?0:Math.round(sub*S.disc.rate);
  const saved=sub-total;
  const now=new Date();
  const time=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  S.daily.revenue+=total;S.daily.count+=1;
  if(saved>0)S.daily.discSaved=(S.daily.discSaved||0)+saved;
  S.daily.log.push({items:names.join('、'),time,amt:total,sub,saved,disc:S.disc.label});
  S.cart={};S.disc={label:null,rate:1};
  document.querySelectorAll('.dbtn').forEach(b=>b.classList.remove('on'));
  document.getElementById('customDiscInput').value='';document.getElementById('freeToggle').checked=false;
  save();showToast('結帳完成 +'+cur()+total+(saved>0?' 省'+cur()+saved:''));rAll();
}

function rLog(){
  const el=document.getElementById('logWrap');
  if(!S.daily.log.length){el.innerHTML='<div class="log-empty">尚無今日交易記錄</div>';return;}
  el.innerHTML=[...S.daily.log].reverse().map((l,i,arr)=>{
    const no=arr.length-i;
    return`<div class="log-item">
      <div class="log-top"><span class="log-no">#${no}</span><div class="log-right">${l.disc?`<span class="log-disc-badge">${l.disc}</span>`:''}<span class="log-amt">${cur()}${l.amt}</span><span class="log-time">${l.time}</span></div></div>
      <div class="log-items-text">${l.items}${l.saved>0?' · 省'+cur()+l.saved:''}</div>
    </div>`;}).join('');
}

// ── HISTORY ──
function rHistDateGrid(){
  // Group by year
  const byYear = {};
  Object.keys(HIST_DATA).forEach(d=>{
    const yr = d.split('/')[0];
    if(!byYear[yr]) byYear[yr]=[];
    byYear[yr].push(d);
  });
  // Also add today's data if has records
  if(S.daily.log.length){
    const yr=TODAY.split('/')[0];
    if(!byYear[yr]) byYear[yr]=[];
    if(!byYear[yr].includes(TODAY)) byYear[yr].push(TODAY);
  }
  const el=document.getElementById('histDateGrid');
  el.innerHTML=Object.keys(byYear).sort().map(yr=>`
    <div class="hist-year-group">
      <div class="hist-year-label">${yr}</div>
      <div class="hist-date-pills">${byYear[yr].sort().map(d=>{
        const md=d.split('/').slice(1).join('/');
        return`<div class="date-pill ${d===selectedHistDate?'on':''}" onclick="selectHistDate('${d}')">${md}</div>`;
      }).join('')}</div>
    </div>`).join('');
}

function selectHistDate(date){
  selectedHistDate=date;
  rHistDateGrid();
  const el=document.getElementById('histContent');
  let data=null;
  if(date===TODAY && S.daily.log.length){
    // Show today's live data
    data={total:S.daily.revenue,cash:null,linepay:null,items:[],isToday:true};
  } else {
    data=HIST_DATA[date];
  }
  if(!data){el.innerHTML='<div class="hist-empty">此日無記錄</div>';return;}
  const isToday=data.isToday;
  let html=`<div class="hist-day-header"><span class="hist-day-date">📅 ${date}</span><span class="hist-day-total">${cur()}${data.total}</span></div>`;
  if(isToday){
    // Show from log
    html+=[...S.daily.log].reverse().map((l,i,arr)=>{
      const no=arr.length-i;
      return`<div style="padding:7px 0;border-bottom:1px solid var(--border);font-size:12px">
        <div style="display:flex;justify-content:space-between;margin-bottom:2px"><span style="color:var(--text3)">#${no} ${l.time}</span><span style="font-weight:700;color:var(--green)">${cur()}${l.amt}</span></div>
        <div style="color:var(--text2)">${l.items}</div>
      </div>`;}).join('');
  } else {
    html+=data.items.map(it=>`
      <div class="hist-item-row">
        <span class="hist-item-name">${it.name}</span>
        <span class="hist-item-qty">×${it.qty}</span>
        <span class="hist-item-sub">${cur()}${it.sub}</span>
      </div>`).join('');
    if(data.cash!==null||data.linepay!==null){
      html+=`<div class="hist-pay-row">`;
      if(data.cash>0) html+=`<span class="pay-badge cash">現金 ${cur()}${data.cash}</span>`;
      if(data.linepay>0) html+=`<span class="pay-badge lp">Line Pay ${cur()}${data.linepay}</span>`;
      html+=`</div>`;
    }
  }
  el.innerHTML=html;
}

function rHist(){rHistDateGrid();}

// ── SUMMARY (all-time) ──
function rSummary(){
  // Merge hist + today
  const allDays = {...HIST_DATA};
  if(S.daily.log.length && S.daily.revenue>0){
    allDays[TODAY]={total:S.daily.revenue,cash:null,linepay:null,items:[]};// simplified
  }
  const totalRevAll = Object.values(allDays).reduce((a,d)=>a+d.total,0);
  const totalDays = Object.keys(allDays).length;
  const avgDay = totalDays ? Math.round(totalRevAll/totalDays) : 0;
  // Top items across all history
  const topMap={};
  Object.values(HIST_DATA).forEach(d=>d.items.forEach(it=>{topMap[it.name]=(topMap[it.name]||0)+it.qty;}));
  if(S.daily.log.length){
    S.daily.log.forEach(l=>l.items.split('、').forEach(s=>{
      const m=s.match(/^(.+?)(?:×(\d+))?$/);if(!m)return;
      topMap[m[1]]=(topMap[m[1]]||0)+(m[2]?parseInt(m[2]):1);
    }));
  }
  const topItems=Object.entries(topMap).sort((a,b)=>b[1]-a[1]).slice(0,8);
  // Today stats
  const todayRev=S.daily.revenue;
  const todayAvg=S.daily.count?Math.round(todayRev/S.daily.count):0;

  document.getElementById('summaryWrap').innerHTML=`
    <div class="sum-sec-title">今日</div>
    <div class="sum-cards">
      <div class="sum-card"><span class="sc-label">今日營業額</span><span class="sc-val" style="color:var(--green)">${cur()}${todayRev}</span></div>
      <div class="sum-card"><span class="sc-label">今日筆數</span><span class="sc-val">${S.daily.count} 筆</span></div>
      <div class="sum-card"><span class="sc-label">今日客單價</span><span class="sc-val">${cur()}${todayAvg}</span></div>
      <div class="sum-card"><span class="sc-label">今日讓利</span><span class="sc-val" style="color:var(--amber)">${cur()}${S.daily.discSaved||0}</span></div>
    </div>
    <div class="sum-sec-title">歷史總覽（全 ${totalDays} 天）</div>
    <div class="sum-cards">
      <div class="sum-card"><span class="sc-label">總營業額</span><span class="sc-val" style="color:var(--green)">${cur()}${totalRevAll.toLocaleString()}</span></div>
      <div class="sum-card"><span class="sc-label">攤位天數</span><span class="sc-val">${totalDays} 天</span></div>
      <div class="sum-card"><span class="sc-label">日均營業額</span><span class="sc-val">${cur()}${avgDay.toLocaleString()}</span></div>
    </div>
    <div class="sum-sec-title">全時期熱銷 TOP 8</div>
    ${topItems.map(([name,qty],i)=>`
      <div class="top-item-row">
        <div class="top-rank ${i===0?'r1':i===1?'r2':i===2?'r3':''}">${i+1}</div>
        <span class="top-item-name">${name}</span>
        <span class="top-item-qty">${qty} 件</span>
      </div>`).join('')}`;
}

// ── SETTINGS ──
function rSettings(){
  document.getElementById('sShopName').value=S.shopName||'';
  document.getElementById('sCurrency').value=S.currency||'$';
  document.getElementById('discPresetList').innerHTML=S.discPresets.map((p,i)=>`
    <div class="disc-preset-item">
      <input class="dpi-lin" value="${p.label}" oninput="S.discPresets[${i}].label=this.value">
      <input class="dpi-in" type="number" value="${p.value}" min="1" max="99" oninput="S.discPresets[${i}].value=parseInt(this.value)||0">
      <span style="font-size:11px;color:var(--text2)">折</span>
      <button class="dpi-del" onclick="removeDiscPreset(${i})">×</button>
    </div>`).join('');
}
function addDiscPreset(){S.discPresets.push({label:'新折扣',value:80});rSettings();}
function removeDiscPreset(i){S.discPresets.splice(i,1);rSettings();}
function saveSettings(){
  S.shopName=document.getElementById('sShopName').value.trim()||'文創小攤';
  S.currency=document.getElementById('sCurrency').value.trim()||'$';
  save();rAll();rPresetDisc();showToast('設定已儲存 ✓');
}

// ── ITEM MODAL ──
function openAddItem(){
  document.getElementById('itemModalTitle').textContent='新增商品';document.getElementById('eid').value='';
  document.getElementById('iname').value='';document.getElementById('iprice').value='';
  document.getElementById('icat').value=activeTab==='全部'?'':activeTab;document.getElementById('iemoji').value='';
  document.getElementById('mdelBtn').style.display='none';renderEmojiRow(null);document.getElementById('itemModal').style.display='flex';
}
function openEditItem(id){
  const item=S.items.find(i=>i.id===id);if(!item)return;
  document.getElementById('itemModalTitle').textContent='編輯商品';document.getElementById('eid').value=id;
  document.getElementById('iname').value=item.name;document.getElementById('iprice').value=item.price;
  document.getElementById('icat').value=item.cat;document.getElementById('iemoji').value=item.emoji||'';
  document.getElementById('mdelBtn').style.display='block';renderEmojiRow(item.emoji);document.getElementById('itemModal').style.display='flex';
}
function renderEmojiRow(sel){
  document.getElementById('emojiRow').innerHTML=EMOJIS.map(e=>`<div class="emoji-opt ${e===sel?'sel':''}" onclick="selectEmoji('${e}')">${e}</div>`).join('');
}
function selectEmoji(e){document.getElementById('iemoji').value=e;document.querySelectorAll('.emoji-opt').forEach(el=>el.classList.toggle('sel',el.textContent===e));}
function closeItemModal(){document.getElementById('itemModal').style.display='none';}
function saveItem(){
  const name=document.getElementById('iname').value.trim();
  const price=parseInt(document.getElementById('iprice').value);
  const cat=document.getElementById('icat').value.trim()||'其他';
  const emoji=document.getElementById('iemoji').value.trim()||'🎁';
  if(!name||!price||price<1){showToast('請填寫名稱與有效價格');return;}
  const eid=document.getElementById('eid').value;
  if(eid){const item=S.items.find(i=>i.id==eid);if(item){item.name=name;item.price=price;item.cat=cat;item.emoji=emoji;}}
  else S.items.push({id:Date.now(),name,price,cat,emoji});
  save();closeItemModal();rAll();
}
function delItem(){const eid=document.getElementById('eid').value;if(!eid)return;S.items=S.items.filter(i=>i.id!=eid);delete S.cart[eid];save();closeItemModal();rAll();}

// ── PANEL SWITCHING ──
function switchPanel(p){
  ['order','log','hist','summary','settings'].forEach(x=>{
    document.getElementById('panel-'+x).style.display='none';
    const t=document.getElementById('ptab-'+x);if(t)t.classList.remove('on');
  });
  document.getElementById('panel-'+p).style.display='flex';
  const pt=document.getElementById('ptab-'+p);if(pt){pt.classList.add('on');pt.style.display='';}
  document.getElementById('btn-settings').classList.toggle('active',p==='settings');
  activePanel=p;
  if(p==='log')rLog();
  if(p==='hist')rHist();
  if(p==='summary')rSummary();
  if(p==='settings')rSettings();
}

// ── DATA MANAGEMENT ──
function exportCSV(){
  if(!S.daily.log.length){showToast('尚無記錄可匯出');return;}
  const rows=[['筆號','時間','商品','小計','折扣','實收']];
  S.daily.log.forEach((l,i)=>rows.push([i+1,l.time,l.items,l.sub||l.amt,l.disc||'無',l.amt]));
  const csv=rows.map(r=>r.map(c=>`"${c}"`).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));
  a.download=`營業記錄_${TODAY.replace(/\//g,'-')}.csv`;a.click();showToast('已匯出 CSV 📥');
}
function doClr(){S.daily={date:TODAY,revenue:0,discSaved:0,count:0,log:[]};save();rAll();showToast('今日記錄已清除');}
function doReset(){localStorage.removeItem(SK);S=JSON.parse(JSON.stringify(DEFAULT_STATE));activeTab='全部';save();rPresetDisc();rAll();switchPanel('order');showToast('已重設為預設值');}

function confirmAction(id,title,msg,cb){
  document.getElementById('confirmTitle').textContent=title;
  document.getElementById('confirmMsg').textContent=msg;
  document.getElementById('confirmOkBtn').onclick=()=>{closeConfirm();cb();};
  document.getElementById('confirmModal').style.display='flex';
}
function closeConfirm(){document.getElementById('confirmModal').style.display='none';}

function showToast(msg){const t=document.getElementById('toastEl');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

// ── INIT ──
load();rPresetDisc();rAll();
</script>
